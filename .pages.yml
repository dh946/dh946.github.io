media:
  input: source/img/uploads
  output: /img/uploads
  rename: random
  categories: [image]

content:
  - name: moments
    label: 动态
    type: file
    path: source/_data/moments.yml
    format: yaml
    list: true
    fields:
      - name: date
        label: 时间
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: text
        label: 这次想记录什么
        type: text
        required: true
      - name: images
        label: 照片
        type: object
        list:
          max: 9
          collapsible: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true
          - name: alt
            label: 图片描述
            type: string
      - name: tags
        label: 标签
        type: string
        list: true
  - name: posts
    label: 文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [.gitkeep]
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
