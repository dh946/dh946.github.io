media:
  - name: images
    label: 图片
    input: source/img/uploads
    output: /img/uploads
    rename: random
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, gif]
  - name: audio
    label: 音频
    input: source/music/uploads
    output: /music/uploads
    rename: safe
    categories: [audio]
    extensions: [mp3, m4a, ogg, wav, aac]

content:
  - name: moments
    label: 动态
    type: file
    path: source/_data/moments.yml
    format: yaml
    list: true
    fields:
      - name: date
        label: 时间
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: text
        label: 这次想记录什么
        type: text
        required: true
      - name: images
        label: 照片
        type: object
        list:
          max: 9
          collapsible: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true
            options:
              media: images
              path: source/img/uploads
          - name: alt
            label: 图片描述
            type: string
      - name: tags
        label: 标签
        type: string
        list: true
  - name: posts
    label: 文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [.gitkeep]
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面
        type: image
        options:
          media: images
          path: source/img/uploads
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          media: images
          path: source/img/uploads
  - name: site
    label: 网站设置
    type: file
    path: source/_data/site.yml
    format: yaml
    fields:
      - name: home_background
        label: 首页背景图
        type: image
        options:
          media: images
          path: source/img/uploads
  - name: music
    label: 音乐播放器
    type: file
    path: source/_data/music.yml
    format: yaml
    fields:
      - name: enabled
        label: 显示播放器
        type: boolean
      - name: autoplay
        label: 尝试自动播放
        type: boolean
      - name: loop
        label: 播放结束后
        type: select
        options:
          values: [all, one, none]
      - name: tracks
        label: 歌单
        type: object
        list:
          max: 100
          collapsible: true
        fields:
          - name: title
            label: 曲目名称
            type: string
            required: true
          - name: artist
            label: 作者或演唱者
            type: string
          - name: file
            label: 音频文件
            type: file
            required: true
            options:
              media: audio
              path: source/music/uploads
              categories: [audio]
              extensions: [mp3, m4a, ogg, wav, aac]
          - name: cover
            label: 封面图片
            type: image
            options:
              media: images
              path: source/img/uploads
  - name: albums
    label: 相册管理
    type: file
    path: source/_data/albums.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: 相册名称
        type: string
        required: true
      - name: slug
        label: 页面地址（英文或拼音）
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: date
        label: 日期
        type: date
        required: true
      - name: description
        label: 相册简介
        type: text
      - name: cover
        label: 封面照片
        type: image
        options:
          media: images
          path: source/img/uploads
      - name: photos
        label: 照片（可多选）
        type: image
        required: true
        options:
          media: images
          path: source/img/uploads
          multiple:
            max: 24
          unique: true

